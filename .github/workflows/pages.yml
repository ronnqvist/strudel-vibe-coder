# SPDX-License-Identifier: MIT
#
# Checks every change, and publishes the site to GitHub Pages from main.
#
# Publishing needs the repository setting  Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Until that is switched, the "Deploy" job fails after a push to main; the checks are unaffected.
#
# Actions are pinned to full commit IDs (the version is in the comment). Update them deliberately.
name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Licences of everything in the bundle
        run: npm run licenses
      - name: Build for GitHub Pages (served under /strudel-vibe-coder/)
        run: npx vite build --base=/strudel-vibe-coder/ --outDir dist
      - name: The bundle must not contain the Strudel embed (AGPL)
        run: |
          if grep -rEl "strudel-repl|@strudel/embed" dist; then
            echo "::error::Strudel embed code found in the build"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Deploy
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
